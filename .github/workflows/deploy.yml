name: Refresh build-info (daily redeploy)

# Objectif : pousser un commit quotidien sur `main` avec un `build-info.json`
# à jour (commits de `develop`, jours restants, date de build). Le push sur
# `main` déclenche le webhook Coolify qui redéploie le site.

on:
  schedule:
    # Tous les jours à 04:00 UTC (~06:00 Paris l'hiver, 05:00 l'été).
    - cron: '0 4 * * *'
  # Permet de forcer manuellement un refresh depuis l'onglet Actions.
  workflow_dispatch:
  # Déclenché aussi quand `develop` bouge, pour que la landing reflète vite
  # les nouveaux commits sans attendre le cron.
  push:
    branches: [develop]

permissions:
  contents: write

concurrency:
  group: refresh-build-info
  cancel-in-progress: false

jobs:
  refresh:
    name: Update src/build-info.json on main
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          # Profondeur complète : on a besoin de l'historique de `develop`.
          fetch-depth: 0

      - name: Fetch develop branch
        run: git fetch origin develop:develop

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Regenerate build-info.json
        run: node scripts/generate-build-info.mjs

      - name: Commit & push if changed
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --quiet src/build-info.json; then
            echo "No changes — skipping commit."
            exit 0
          fi
          git add src/build-info.json
          git commit -m "chore(build-info): refresh from develop [skip ci]"
          # Rebase au cas où un push concurrent est arrivé entre-temps.
          git pull --rebase origin main
          git push origin main
