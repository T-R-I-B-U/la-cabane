name: Format

on:
  pull_request:
  push:
    branches: [main]

jobs:
  prettier:
    name: Prettier check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Check formatting
        run: npx prettier --check "src/**/*.{js,jsx,css,json}"